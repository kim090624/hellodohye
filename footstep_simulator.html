<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지오폰 야생동물 감지 시뮬레이터</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0B0F19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-glow: rgba(59, 130, 246, 0.15);
            
            /* Status Colors */
            --status-idle: #3B82F6;
            --status-detected: #EA580C; /* Vibrant Orange */
            --text-muted: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none; /* Disable text selection for app-like feel */
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 24px;
        }

        /* Ambient background glow */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(11, 15, 25, 0) 70%);
            z-index: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Top Header */
        header {
            width: 100%;
            max-width: 450px;
            text-align: center;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #F3F4F6;
            text-transform: uppercase;
        }

        .system-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--status-idle);
            box-shadow: 0 0 8px var(--status-idle);
            transition: all 0.2s ease;
        }

        /* Center Display Area */
        .display-container {
            width: 100%;
            max-width: 450px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            gap: 30px;
            margin: 40px 0;
        }

        /* Main Status Card */
        .status-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background-color: var(--status-idle);
            transition: background-color 0.3s ease;
        }

        .status-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .status-value {
            font-size: 2.2rem;
            font-weight: 800;
            margin-top: 12px;
            color: #FFFFFF;
            transition: color 0.2s ease;
        }

        .sub-value {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-family: monospace;
        }

        /* Interactive Touch Pad */
        .touch-pad {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #1F2937 0%, #111827 100%);
            border: 4px solid #374151;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-pad::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--status-idle);
            opacity: 0.4;
            animation: pulse 2s infinite;
            pointer-events: none;
            transition: border-color 0.2s ease;
        }

        .touch-pad-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }

        .touch-pad span {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #9CA3AF;
            text-align: center;
            padding: 0 16px;
        }

        /* Active State Classes */
        body.detected-state {
            --bg-color: #190F05;
        }

        body.detected-state .ambient-glow {
            background: radial-gradient(circle, rgba(234, 88, 12, 0.25) 0%, rgba(25, 15, 5, 0) 70%);
        }

        body.detected-state .status-dot {
            background-color: var(--status-detected);
            box-shadow: 0 0 12px var(--status-detected);
        }

        body.detected-state .status-card {
            border-color: rgba(234, 88, 12, 0.3);
            box-shadow: 0 15px 50px rgba(234, 88, 12, 0.15);
        }

        body.detected-state .status-card::before {
            background-color: var(--status-detected);
        }

        body.detected-state .status-value {
            color: var(--status-detected);
            animation: text-pulse 1s infinite alternate;
        }

        body.detected-state .touch-pad {
            border-color: var(--status-detected);
            transform: scale(0.92);
            box-shadow: 0 0 35px rgba(234, 88, 12, 0.3), inset 0 2px 5px rgba(255,255,255,0.02);
            background: radial-gradient(circle, #2C1A0C 0%, #170E06 100%);
        }

        body.detected-state .touch-pad::after {
            border-color: var(--status-detected);
            animation: pulse-fast 0.8s infinite;
        }

        body.detected-state .touch-pad-icon {
            transform: scale(1.1);
        }

        /* Footer / Instructions */
        footer {
            width: 100%;
            max-width: 450px;
            text-align: center;
            z-index: 10;
        }

        .guide-box {
            background: rgba(31, 41, 55, 0.4);
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .guide-box code {
            font-family: monospace;
            background: #111827;
            padding: 2px 6px;
            border-radius: 4px;
            color: #E5E7EB;
        }

        /* Animations */
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        @keyframes pulse-fast {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        @keyframes text-pulse {
            from {
                text-shadow: 0 0 5px rgba(234, 88, 12, 0.2);
            }
            to {
                text-shadow: 0 0 20px rgba(234, 88, 12, 0.6);
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow" id="ambientGlow"></div>

    <!-- Header -->
    <header>
        <h1>지오폰 센서 시뮬레이터</h1>
        <div class="system-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="systemStatusText">시스템 모니터링 중...</span>
        </div>
    </header>

    <!-- Center Display Card and Touchpad -->
    <div class="display-container">
        <div class="status-card" id="statusCard">
            <div class="status-label" id="statusLabel">SYSTEM STATE</div>
            <div class="status-value" id="statusValue">MONITORING...</div>
            <div class="sub-value" id="subValue">Val: 512 (영점 유지)</div>
        </div>

        <div class="touch-pad" id="touchPad" tabindex="0">
            <div class="touch-pad-icon" id="padIcon">🐾</div>
            <span id="padText">눌러서 감지 시뮬레이션</span>
        </div>
    </div>

    <!-- Footer Guide -->
    <footer>
        <div class="guide-box">
            <strong>모바일 연결 방법:</strong><br>
            1. PC 터미널에서 <code>python -m http.server 8000</code> 실행<br>
            2. 같은 와이파이에 연결된 폰 브라우저로 아래 주소 접속:<br>
            <code>http://[컴퓨터IP]:8000/footstep_simulator.html</code>
        </div>
    </footer>

    <script>
        const touchPad = document.getElementById('touchPad');
        const body = document.body;
        const statusValue = document.getElementById('statusValue');
        const statusLabel = document.getElementById('statusLabel');
        const subValue = document.getElementById('subValue');
        const padText = document.getElementById('padText');
        const padIcon = document.getElementById('padIcon');
        const systemStatusText = document.getElementById('systemStatusText');

        // Active State Trigger
        function triggerActive() {
            body.classList.add('detected-state');
            statusValue.innerText = 'ANIMAL DETECTED!';
            statusLabel.innerText = 'WARNING';
            // Randomize a geophone-like value exceeding the normal thresholds
            const randomVal = Math.floor(Math.random() * (900 - 750) + 750);
            subValue.innerText = `Val: ${randomVal} (임계값 초과)`;
            padText.innerText = '손가락을 떼면 원상복귀';
            padIcon.innerText = '⚠️';
            systemStatusText.innerText = '야생동물 진동 감지됨!';
            
            // Trigger haptic vibration (on compatible devices)
            if (navigator.vibrate) {
                navigator.vibrate(80);
            }

            // main.py로 감지 신호 전송
            fetch('/api/press').catch(err => console.error("API Press Error:", err));
        }

        // Deactive State Revert
        function triggerDeactive() {
            body.classList.remove('detected-state');
            statusValue.innerText = 'MONITORING...';
            statusLabel.innerText = 'SYSTEM STATE';
            subValue.innerText = 'Val: 512 (영점 유지)';
            padText.innerText = '눌러서 감지 시뮬레이션';
            padIcon.innerText = '🐾';
            systemStatusText.innerText = '시스템 모니터링 중...';
            
            if (navigator.vibrate) {
                navigator.vibrate(20);
            }

            // main.py로 해제 신호 전송
            fetch('/api/release').catch(err => console.error("API Release Error:", err));
        }

        // Touch and Mouse Event Handlers
        touchPad.addEventListener('mousedown', (e) => {
            e.preventDefault();
            triggerActive();
        });

        touchPad.addEventListener('mouseup', (e) => {
            e.preventDefault();
            triggerDeactive();
        });

        touchPad.addEventListener('mouseleave', () => {
            if (body.classList.contains('detected-state')) {
                triggerDeactive();
            }
        });

        touchPad.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent double tap zoom
            triggerActive();
        });

        touchPad.addEventListener('touchend', (e) => {
            e.preventDefault();
            triggerDeactive();
        });

        touchPad.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            triggerDeactive();
        });

        // Keypress (Spacebar / Enter) support for desktop accessibility testing
        touchPad.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                if (!body.classList.contains('detected-state')) {
                    triggerActive();
                }
            }
        });

        touchPad.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                triggerDeactive();
            }
        });
    </script>
</body>
</html>
