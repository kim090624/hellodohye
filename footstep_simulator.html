<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-touch-callout: none; }
        body, html { 
            width: 100%; height: 100%; 
            background-color: #000000; /* 완벽한 암전 */
            overflow: hidden; cursor: default; 
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* 아이패드/iOS에서 Pointer Event 정상 작동 필수 옵션 */
        }
    </style>
</head>
<body>
    <script>
        let isPressed = false;
        
        function pressDown(e) {
            e.preventDefault();
            if (isPressed) return;
            isPressed = true;
            if (navigator.vibrate) navigator.vibrate([30, 30, 60]);
            fetch(['/a', 'pi/', 'pr', 'ess'].join('')).catch(e => {});
        }
        
        function pressUp(e) {
            e.preventDefault();
            if (!isPressed) return;
            isPressed = false;
            if (navigator.vibrate) navigator.vibrate(20);
            fetch(['/a', 'pi/', 'rel', 'ease'].join('')).catch(e => {});
        }

        const b = document.body;
        // 터치/마우스 중복 발생을 막기 위해 통합된 Pointer 이벤트 사용
        b.addEventListener('pointerdown', pressDown, {passive: false});
        b.addEventListener('pointerup', pressUp, {passive: false});
        b.addEventListener('pointercancel', pressUp, {passive: false});
        b.addEventListener('pointerout', pressUp, {passive: false});
        b.addEventListener('contextmenu', (e) => { e.preventDefault(); });
    </script>
</body>
</html>
