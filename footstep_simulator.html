<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 시뮬레이터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-touch-callout: none; }
        body, html { 
            width: 100%; height: 100%; 
            background-color: #000000; /* 완벽한 암전 */
            overflow: hidden; cursor: default; 
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
    </style>
</head>
<body>
    <script>
        let isPressed = false;
        
        function pressDown(e) {
            if (e && e.preventDefault) e.preventDefault();
            if (isPressed) return;
            isPressed = true;
            if (navigator.vibrate) navigator.vibrate([30, 30, 60]);
            fetch('/api/press?t=' + Date.now(), { cache: 'no-store' }).catch(e => {});
        }
        
        function pressUp(e) {
            if (e && e.preventDefault) e.preventDefault();
            if (!isPressed) return;
            isPressed = false;
            if (navigator.vibrate) navigator.vibrate(20);
            fetch('/api/release?t=' + Date.now(), { cache: 'no-store' }).catch(e => {});
        }

        const b = document.body;
        // 터치 기기용 이벤트
        b.addEventListener('touchstart', pressDown, {passive: false});
        b.addEventListener('touchend', pressUp, {passive: false});
        b.addEventListener('touchcancel', pressUp, {passive: false});
        
        // PC 마우스용 이벤트
        b.addEventListener('mousedown', pressDown);
        b.addEventListener('mouseup', pressUp);
        b.addEventListener('mouseleave', pressUp);
        
        b.addEventListener('contextmenu', (e) => { e.preventDefault(); });
    </script>
</body>
</html>
